name: Claude

# Development jobs: an issue or pull-request comment that mentions @claude starts Claude Code,
# which works on a branch and opens or updates a pull request. CI then runs on that pull request.
#
# Guard rails:
# - Only people with write access can start a job: the action refuses everyone else by default
#   (allowed_non_write_users is left unset), so a public commenter cannot spend the plan.
# - The model is pinned to Haiku 5.5 and each job has a turn cap.
# - Authentication: the CLAUDE_CODE_OAUTH_TOKEN repository secret, created by the owner with
#   `claude setup-token`.
# - GitHub access: the Claude GitHub App, installed on this repository only, so Claude's pushes
#   start CI like anyone else's.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: read

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - uses: anthropics/claude-code-action@cab360f6565aa35a51d6ce9e43f1f4287c0a32ea # v1.0.241
        id: claude
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          show_full_output: true
          claude_args: >-
            --model claude-haiku-5-5
            --max-turns 80
            --allowedTools "Bash(npm *),Bash(npx *),Bash(git *),Bash(node *),Read,Edit,Write,Glob,Grep"
